[package]
name = "mirror-node"
default-run = "mirror-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mirror-core = { path = "../mirror-core" }
mirror-crypto = { path = "../mirror-crypto" }
mirror-consensus = { path = "../mirror-consensus" }
mirror-state = { path = "../mirror-state" }
mirror-chain = { path = "../mirror-chain" }
mirror-storage = { path = "../mirror-storage" }
mirror-network = { path = "../mirror-network" }
mirror-protocol = { path = "../mirror-protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
mirror-personhood = { path = "../mirror-personhood" }
